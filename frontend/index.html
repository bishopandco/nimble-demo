<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ed" />
    <script>
      // Apply the saved preference before the app paints.
      let theme
      try { theme = localStorage.getItem('chat-theme') } catch {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1b1d1a' : '#f4f3ed'
    </script>
    <title>Go API / Svelte Socket Demo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
