root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/api ./cmd/api"
bin = ".air/api"
include_ext = ["go", "sql", "mod", "sum"]
exclude_dir = [".air", ".git", ".idea", "bin", "data", "frontend", "vendor"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = false
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
